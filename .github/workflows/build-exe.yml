name: Build dealer-dashboard EXE

run-name: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' && format('Merge PR #{0}: dealer-dashboard EXE', github.event.inputs.pr_number) || github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && format('Merge PR #{0}: dealer-dashboard EXE', github.event.pull_request.number) || github.event_name == 'pull_request' && format('PR #{0}: dealer-dashboard EXE', github.event.pull_request.number) || github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Merge PR #') && format('{0}: dealer-dashboard EXE', github.event.head_commit.message) || format('dealer-dashboard EXE: {0}', github.ref_name) }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Optional PR number for the run title, e.g. 5'
        required: false
        type: string
        default: ''
  push:
    branches:
      - claude/dealer-dashboard-ui-Rcx1D
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches:
      - claude/dealer-dashboard-ui-Rcx1D

permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  build-windows-exe:
    name: Build Windows EXE
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install build dependencies
        run: |
          $env:CMAKE_ARGS = "-DGGML_NATIVE=OFF -DLLAMA_NATIVE=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF"
          $env:FORCE_CMAKE = "1"
          python -m pip install --upgrade pip setuptools wheel cmake ninja
          python -m pip install --no-binary llama-cpp-python --upgrade --force-reinstall --no-cache-dir -r requirements.txt pyinstaller

      - name: Verify banned heavy AI libraries are absent
        run: |
          python -c "import importlib.util, sys; banned=['torch','transformers']; found=[p for p in banned if importlib.util.find_spec(p)]; print('Banned packages found:', found); sys.exit(1 if found else 0)"

      - name: Syntax checks
        run: |
          python -m py_compile app.py desktop.py ai_engine.py
          node --check static/local_ai.js

      - name: Build one-file EXE
        run: |
          python -m PyInstaller --clean --noconfirm dealer-dashboard.spec

      - name: Verify EXE exists
        run: |
          if (!(Test-Path "dist/dealer-dashboard.exe")) {
            throw "dist/dealer-dashboard.exe was not created"
          }
          Get-Item "dist/dealer-dashboard.exe" | Format-List Name,Length,FullName

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v6
        with:
          name: dealer-dashboard-windows-exe
          path: dist/dealer-dashboard.exe
          if-no-files-found: error

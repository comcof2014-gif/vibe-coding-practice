name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "app.py"
      - "desktop.py"
      - "templates/**"
      - "static/**"
      - "requirements.txt"
      - "dealer_dashboard.spec"
      - "build_windows.bat"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.3"

      - name: Build with PyInstaller
        run: python -m PyInstaller dealer_dashboard.spec --noconfirm

      - name: Verify artifact
        run: |
          dir dist
          if (-not (Test-Path "dist/dealer-dashboard.exe")) { exit 1 }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: dealer-dashboard-win64
          path: dist/dealer-dashboard.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dealer-dashboard.exe
          generate_release_notes: true
